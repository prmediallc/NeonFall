name: Make signing keystore (run once)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password for keystore AND key (letters+numbers, 8+ chars). Remember it!'
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks -storetype JKS \
            -alias neonfall -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass '${{ github.event.inputs.password }}' \
            -keypass '${{ github.event.inputs.password }}' \
            -dname "CN=NeonFall, OU=Games, O=PR Media LLC, L=City, S=State, C=US"
          echo "==== COPY EVERYTHING BETWEEN THE LINES INTO SECRET KEYSTORE_BASE64 ===="
          base64 -w0 release.jks
          echo
          echo "==== END ===="
          echo "KEY_ALIAS = neonfall"

      - name: Save keystore as artifact (download and back it up!)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-BACKUP-THIS
          path: release.jks
