name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore (if secrets are set)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK + Play bundle (AAB)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/NeonFall-debug.apk
          cp app/build/outputs/apk/release/app-release*.apk out/NeonFall-release.apk
          cp app/build/outputs/bundle/release/app-release.aab out/NeonFall-play.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: NeonFall-builds
          path: out/*

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/NeonFall-debug.apk
            out/NeonFall-release.apk
